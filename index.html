<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <meta name="description" content="Personal website of Your Name.">

  <!-- Fonts: Unbounded (headings) and Manrope (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="nav-wrap">
    <nav class="nav">
      <a class="nav-name" href="#top">Your Name</a>

      <!-- Add nav links here, e.g.
           <a href="#about">About</a> -->
      <div class="nav-links"></div>
    </nav>
  </header>

  <main id="top">

    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="container">
        <h1 class="hero-heading">Your Name</h1>
        <p class="hero-text">A short line about who you are goes here.</p>
        <div class="hero-buttons">
          <a class="btn btn-primary" href="#">Primary button</a>
          <a class="btn btn-secondary" href="#">Secondary button</a>
        </div>
      </div>
    </section>

    <!-- ===== Add new sections below this line ===== -->

    <!-- Section template: copy this block, remove the comment
         markers, then change the id, label and heading.

    <section class="section" id="section-id">
      <div class="container">
        <p class="section-label">Label</p>
        <h2 class="section-heading">Section heading</h2>
        Your content goes here.
      </div>
    </section>

    -->

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Your Name</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
